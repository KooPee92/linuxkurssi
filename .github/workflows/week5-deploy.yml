name: Week 5 Automatic Deployment

on:
  push:
    branches:
      - main
    paths:
      - "week5/**"
      - ".github/workflows/week5-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Week 5
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Check Python code
        run: python -m ruff check app.py db.py tests/

      - name: Run automated tests
        run: python -m pytest tests/ -v

  deploy:
    name: Transfer Week 5 Files
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer application files
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          tar -cf - week5 | ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            week5deploy@100.74.37.27 \
            "mkdir -p /var/lib/viikko5-deploy/staging/$DEPLOY_SHA && tar -xf - -C /var/lib/viikko5-deploy/staging/$DEPLOY_SHA"

      - name: Verify transferred files
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            week5deploy@100.74.37.27 \
            "test -f /var/lib/viikko5-deploy/staging/$DEPLOY_SHA/week5/app.py && echo 'Application transfer successful'"
